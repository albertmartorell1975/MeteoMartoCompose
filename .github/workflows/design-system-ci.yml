name: Design System CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'app/src/main/java/com/martorell/albert/meteomartocompose/ui/components/designsystem/**'
      - 'app/src/main/java/com/martorell/albert/meteomartocompose/ui/theme/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/design-system-ci.yml'
  pull_request:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'app/src/main/java/com/martorell/albert/meteomartocompose/ui/components/designsystem/**'
      - 'app/src/main/java/com/martorell/albert/meteomartocompose/ui/theme/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/design-system-ci.yml'

# Permissions for the GITHUB_TOKEN
permissions:
  contents: read
  actions: write

jobs:
  visual-regression:
    name: Visual Regression (Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Visual Regression
        run: ./gradlew :app:verifyRoborazziPreDebug --no-daemon

      - name: Upload Comparison Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-comparison-results
          path: "app/build/outputs/roborazzi/*"
          retention-days: 5

  documentation:
    name: Generate Design System Styleguide (Dokka)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Styleguide
        run: ./gradlew :app:dokkaGenerateHtml -PgenerateDocs -PdesignSystemDocs --no-daemon

      - name: Upload Styleguide Artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-system-styleguide
          path: "app/build/dokka/design-system"
          retention-days: 7
