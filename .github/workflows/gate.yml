name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Gradle Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AGENTS.md referenced paths exist
        run: |
          python3 -c '
          import os, re, sys
          with open("AGENTS.md", encoding="utf-8") as f:
              text = f.read()
          optional = {"CONTEXT.md", "docs/build-brief.md", "DESIGN.md", "ARCHITECTURE.md"}
          tokens = re.findall(r"`([^`]+)`", text)
          missing = []
          for t in tokens:
              if any(c in t for c in (" ", "<", ">", "*")) or t.startswith(("./", "http")) or t in optional:
                  continue
              if "/" in t or re.fullmatch(r"[A-Z]+\.md", t) or t == "feature_list.json":
                  if not os.path.exists(t):
                      missing.append(t)
          if missing:
              print("Missing paths referenced in AGENTS.md:", missing, file=sys.stderr)
              sys.exit(1)
          print("All AGENTS.md referenced paths exist.")
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Canonical Gate Command
        run: ./gradlew testPreDebugUnitTest lintPreDebug --parallel --build-cache --configuration-cache
