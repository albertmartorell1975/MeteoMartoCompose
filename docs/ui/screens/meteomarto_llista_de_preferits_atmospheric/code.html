<!DOCTYPE html>

<html lang="ca"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meteo Marto - List of Favorites</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            m3: {
              surface: '#F8F9FA',
              onSurface: '#1F1F24',
              surfaceVariant: '#E1E2EC',
              onSurfaceVariant: '#44474E',
              primaryPill: '#D8E2FF',
              onPrimaryPill: '#001D35',
            }
          }
        }
      }
    }
  </script>
<!-- Typography & App Shell Custom Styling -->
<style data-purpose="base-styling">
    body {
      background-color: #F8F9FA;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Hide scrollbar for clean mobile appearance */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- Atmospheric Glassmorphic Card Styling -->
<style data-purpose="card-theming">
    .card-clouds {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(226, 232, 240, 0.7) 100%);
      border: 1px solid rgba(203, 213, 225, 0.6);
      box-shadow: 0 8px 24px -6px rgba(100, 116, 139, 0.12);
    }
    .card-sunny {
      background: linear-gradient(135deg, rgba(255, 253, 245, 0.95) 0%, rgba(254, 243, 199, 0.6) 100%);
      border: 1px solid rgba(253, 230, 138, 0.7);
      box-shadow: 0 8px 24px -6px rgba(245, 158, 11, 0.14);
    }
    .card-rain {
      background: linear-gradient(135deg, rgba(240, 249, 255, 0.95) 0%, rgba(224, 242, 254, 0.65) 100%);
      border: 1px solid rgba(186, 230, 253, 0.7);
      box-shadow: 0 8px 24px -6px rgba(14, 165, 233, 0.12);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-900 sm:p-4">
<!-- Mobile Frame Container (Material 3 Mobile Shell) -->
<div class="relative w-full max-w-[420px] h-[100dvh] max-h-[920px] bg-[#F9FAFC] flex flex-col overflow-hidden sm:rounded-[44px] shadow-2xl border-slate-800">
<!-- BEGIN: StatusBar -->
<!-- Android / iOS Style Clean Status Bar -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-xs font-semibold text-[#1F1F24] z-20" data-purpose="status-bar">
<div class="flex items-center space-x-1.5">
<span class="tracking-tight text-[13px]">2:09</span>
<!-- Shield Privacy Indicator -->
<svg class="w-3.5 h-3.5 text-slate-700 ml-1 inline-block" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 3s7 3 7 8c0 5-7 10-7 10S5 16 5 11c0-5 7-8 7-8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="flex items-center space-x-1.5 text-slate-800">
<!-- Cellular Bars -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M2 20h20L22 4z"></path>
</svg>
<!-- Wifi -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M8.5 16.5a5 5 0 017 0M5 13a10 10 0 0114 0M1.5 9.5a15 15 0 0121 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border-[1.5px] border-slate-800 rounded-sm p-[1px] flex items-center">
<div class="w-full h-full bg-slate-800 rounded-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: AppHeader -->
<!-- Top Bar with Screen Title -->
<section class="px-6 pt-3 pb-3 shrink-0" data-purpose="screen-header">
<h1 class="text-2xl font-normal tracking-tight text-[#1F1F24]">
        List of Favorites
      </h1>
</section>
<!-- END: AppHeader -->
<!-- BEGIN: FavoritesList -->
<!-- Main scrollable list of weather favorited cities -->
<main class="flex-1 overflow-y-auto px-5 pt-2 pb-6 space-y-3.5 no-scrollbar" data-purpose="favorites-container">
<!-- Item 1: Mountain View (Matches original screenshot) -->
<article class="card-clouds relative rounded-2xl p-4 transition-all active:scale-[0.99] backdrop-blur-md" data-purpose="weather-card">
<div class="flex items-start justify-between">
<div>
<h2 class="text-[20px] font-semibold text-slate-800 tracking-tight leading-snug">
              Mountain View
            </h2>
<div class="flex items-center gap-3.5 mt-2">
<!-- Cloud Graphic Representation -->
<div class="relative w-11 h-7 shrink-0 flex items-center">
<!-- Dark grey back cloud -->
<svg class="w-7 h-5 text-slate-600 absolute right-0.5 top-0 fill-current opacity-90" viewbox="0 0 24 24">
<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"></path>
</svg>
<!-- Light grey front cloud -->
<svg class="w-8 h-6 text-slate-200 absolute left-0 bottom-0 fill-current drop-shadow-sm" viewbox="0 0 24 24">
<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"></path>
</svg>
</div>
<span class="text-slate-600 text-sm font-normal">
                broken clouds
              </span>
</div>
</div>
<!-- Right: Temp & Action -->
<div class="flex flex-col items-end justify-between h-full pt-0.5">
<!-- Delete Button (Compose Icon Button) -->
<button aria-label="Delete Mountain View from favorites" class="text-slate-700 hover:text-red-500 active:opacity-60 transition-colors p-1 -mr-1">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path>
</svg>
</button>
<span class="text-xl font-medium text-slate-700 tracking-tight mt-3">28.3°</span>
</div>
</div>
</article>
<!-- Item 2: Barcelona (Atmospheric Golden/Sunny) -->
<article class="card-sunny relative rounded-2xl p-4 transition-all active:scale-[0.99] backdrop-blur-md" data-purpose="weather-card">
<div class="flex items-start justify-between">
<div>
<h2 class="text-[20px] font-semibold text-slate-800 tracking-tight leading-snug">
              Barcelona
            </h2>
<div class="flex items-center gap-3.5 mt-2">
<!-- Golden Sun Icon -->
<div class="w-11 h-7 flex items-center justify-start pl-1">
<svg class="w-7 h-7 text-amber-500 fill-current" viewbox="0 0 24 24">
<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"></path>
</svg>
</div>
<span class="text-amber-900/75 text-sm font-normal">
                clear sky
              </span>
</div>
</div>
<div class="flex flex-col items-end justify-between h-full pt-0.5">
<button aria-label="Delete Barcelona from favorites" class="text-slate-600 hover:text-red-500 active:opacity-60 transition-colors p-1 -mr-1">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path>
</svg>
</button>
<span class="text-xl font-medium text-amber-950/80 tracking-tight mt-3">22.6°</span>
</div>
</div>
</article>
<!-- Item 3: London (Atmospheric Rain) -->
<article class="card-rain relative rounded-2xl p-4 transition-all active:scale-[0.99] backdrop-blur-md" data-purpose="weather-card">
<div class="flex items-start justify-between">
<div>
<h2 class="text-[20px] font-semibold text-slate-800 tracking-tight leading-snug">
              London
            </h2>
<div class="flex items-center gap-3.5 mt-2">
<!-- Rain Cloud Icon -->
<div class="w-11 h-7 flex items-center justify-start pl-1">
<svg class="w-7 h-7 text-sky-600 fill-current" viewbox="0 0 24 24">
<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 18l-1.5 2.5h-1.5l1.5-2.5h1.5zm4 0l-1.5 2.5h-1.5l1.5-2.5h1.5zm4 0l-1.5 2.5h-1.5l1.5-2.5h1.5z"></path>
</svg>
</div>
<span class="text-sky-900/75 text-sm font-normal">
                light rain
              </span>
</div>
</div>
<div class="flex flex-col items-end justify-between h-full pt-0.5">
<button aria-label="Delete London from favorites" class="text-slate-600 hover:text-red-500 active:opacity-60 transition-colors p-1 -mr-1">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path>
</svg>
</button>
<span class="text-xl font-medium text-sky-950/80 tracking-tight mt-3">14.1°</span>
</div>
</div>
</article>
</main>
<!-- END: FavoritesList -->
<!-- BEGIN: BottomNavigation -->
<!-- Android Material Design 3 Navigation Bar matching original screenshots -->
<nav class="bg-[#F0F2F7] border-t border-slate-200/50 pt-2 pb-6 px-6 flex justify-around items-center shrink-0 z-30" data-purpose="bottom-nav">
<!-- Tab 1: City (Inactive) -->
<button aria-selected="false" class="flex flex-col items-center justify-center group flex-1" data-purpose="nav-tab-city">
<div class="w-16 h-8 rounded-full flex items-center justify-center transition-colors group-hover:bg-slate-200/60">
<!-- Building / City Icon -->
<svg class="w-5 h-5 text-slate-700" fill="currentColor" viewbox="0 0 24 24">
<path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z"></path>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-700 mt-0.5 tracking-tight">City</span>
</button>
<!-- Tab 2: Favorites (Active with Material 3 Pill Indicator) -->
<button aria-selected="true" class="flex flex-col items-center justify-center group flex-1" data-purpose="nav-tab-favorites">
<div class="w-16 h-8 rounded-full bg-[#D8E2FF] flex items-center justify-center">
<!-- Heart Icon (Solid filled) -->
<svg class="w-5 h-5 text-[#001D35]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
</svg>
</div>
<span class="text-[11px] font-semibold text-[#1F1F24] mt-0.5 tracking-tight">Favorites</span>
</button>
</nav>
<!-- END: BottomNavigation -->
<!-- Android Home Indicator Bar -->
<div class="w-full bg-[#F0F2F7] pb-2 flex justify-center items-center">
<div class="w-32 h-1 bg-slate-700/80 rounded-full"></div>
</div>
</div>
</body></html>
