<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Meteo Marto - Forecast Error</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            meteo: {
              bg: '#f8fafc',
              primary: '#475569',
              button: '#475a84',
              buttonHover: '#3b4b6e',
              pill: '#dbeafe',
              accent: '#3b82f6',
              textDark: '#1e293b',
              textMuted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
<style data-purpose="glow-effects">
    /* Subtle Atmospheric dynamic glow and pulse */
    .weather-glow {
      background: radial-gradient(circle at 50% 40%, rgba(199, 210, 254, 0.4) 0%, rgba(241, 245, 249, 0) 70%);
    }
    .glow-drop {
      filter: drop-shadow(0 10px 18px rgba(71, 90, 132, 0.15));
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-meteo-bg text-meteo-textDark min-h-screen flex flex-col justify-between font-sans antialiased overflow-hidden select-none">
<!-- BEGIN: Status Bar Container -->
<aside class="w-full pt-2 px-6 flex justify-between items-center text-xs font-semibold text-slate-800 tracking-tight z-50" data-purpose="status-bar">
<div class="flex items-center space-x-1.5">
<span class="text-[14px]">2:10</span>
<!-- Shield icon for privacy/security status -->
<svg class="w-3.5 h-3.5 text-slate-700 ml-0.5 inline-block" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="flex items-center space-x-2">
<!-- Airplane icon -->
<svg class="w-4 h-4 text-slate-800" fill="currentColor" viewbox="0 0 24 24">
<path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"></path>
</svg>
<!-- Battery icon -->
<div class="w-5 h-2.5 border border-slate-800 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</aside>
<!-- END: Status Bar Container -->
<!-- BEGIN: MainHeader -->
<header class="w-full px-6 py-4 flex items-center justify-between border-b border-transparent" data-purpose="app-bar">
<h1 class="text-2xl font-normal text-slate-900 tracking-tight">Meteo Marto</h1>
<!-- Sign out / Exit action button -->
<button aria-label="Sign out" class="p-1 rounded-full text-slate-700 hover:text-slate-950 transition-colors focus:outline-none">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center px-6 relative weather-glow" data-purpose="error-state-view">
<!-- Atmospheric Visual Illustration Card -->
<div class="relative mb-6 flex items-center justify-center" data-purpose="atmospheric-illustration">
<!-- Ambient aura rings -->
<div class="absolute w-44 h-44 rounded-full bg-blue-100/60 blur-2xl animate-pulse"></div>
<!-- Styled atmospheric weather icon with disconnection badge -->
<div class="relative w-28 h-28 rounded-full bg-gradient-to-b from-white/90 to-blue-50/80 shadow-md border border-white/60 flex items-center justify-center glow-drop">
<!-- Weather cloud silhouette -->
<svg class="w-14 h-14 text-slate-400/90" fill="currentColor" viewbox="0 0 24 24">
<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"></path>
</svg>
<!-- Signal loss / Alert badge indicator -->
<div class="absolute -bottom-1 -right-1 w-9 h-9 rounded-full bg-amber-50 border-2 border-white shadow-sm flex items-center justify-center text-amber-500">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M12 9v3.75m0 3.75h.007v.008H12v-.008zM12 3a9 9 0 100 18 9 9 0 000-18z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Error Title & Detail -->
<div class="text-center max-w-sm mx-auto space-y-2 mb-8">
<h2 class="text-2xl sm:text-3xl font-medium tracking-tight text-slate-900 leading-snug px-4">
        Failed to find out the city forecast
      </h2>
<p class="text-sm text-meteo-textMuted px-6 leading-relaxed">
        Unable to connect to weather telemetry service or location not found.
      </p>
</div>
<!-- Primary Action Button -->
<div class="flex justify-center w-full" data-purpose="action-controls">
<button class="inline-flex items-center justify-center px-8 py-3.5 rounded-full bg-[#475a84] hover:bg-[#3b4b6e] active:scale-95 text-white font-medium text-[15px] shadow-sm transition-all duration-150 min-w-[190px]" id="btn-update-forecast" type="button">
        Update forecast
      </button>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation & DeviceAffordance -->
<footer class="w-full bg-meteo-bg/80 backdrop-blur-md pt-2 pb-1 border-t border-slate-100 flex flex-col items-center" data-purpose="bottom-bar">
<!-- Tab Navigation items -->
<nav aria-label="Bottom Navigation" class="w-full max-w-md px-12 grid grid-cols-2 gap-4 py-1">
<!-- City Tab (Active) -->
<button aria-current="page" class="flex flex-col items-center justify-center group focus:outline-none" type="button">
<div class="px-5 py-1.5 rounded-full bg-[#e3ecfa] group-hover:bg-[#d5e2f7] transition-colors flex items-center justify-center mb-1">
<!-- City Icon (Solid building shapes) -->
<svg class="w-6 h-6 text-[#29364d]" fill="currentColor" viewbox="0 0 24 24">
<path d="M19 2H9c-1.1 0-2 .9-2 2v3H5c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 4h2v2h-2V6zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm-6 2h2v2H5v-2zm0-4h2v2H5v-2zm0-4h2v2H5V8zm12 10h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V8h2v2zm0-4h-2V4h2v2z"></path>
</svg>
</div>
<span class="text-xs font-semibold text-slate-800">City</span>
</button>
<!-- Favorites Tab (Inactive) -->
<button class="flex flex-col items-center justify-center group focus:outline-none text-slate-500 hover:text-slate-700" type="button">
<div class="px-5 py-1.5 rounded-full bg-transparent flex items-center justify-center mb-1">
<!-- Favorites Heart Icon -->
<svg class="w-6 h-6 text-[#5b6473] group-hover:text-slate-700 transition-colors" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
</svg>
</div>
<span class="text-xs font-normal text-slate-500 group-hover:text-slate-700">Favorites</span>
</button>
</nav>
<!-- Android Home Indicator Pill -->
<div class="w-full flex justify-center py-2 safe-bottom" data-purpose="gesture-indicator">
<div class="w-32 h-1 bg-slate-600 rounded-full"></div>
</div>
</footer>
<!-- END: BottomNavigation & DeviceAffordance -->
</body></html>
