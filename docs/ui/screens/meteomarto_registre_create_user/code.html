<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MeteoMarto - Create a new user</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            atmospheric: {
              title: '#54558e',
              border: '#535b88',
              label: '#717598',
              placeholder: '#72778e',
              btnDisabled: '#dfdfeb',
              btnDisabledText: '#8f92a8',
              btnPrimary: '#535799',
              link: '#485382',
              bgLight: '#fcfbfe',
              bgGlow: '#f1f0fa'
            }
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="atmospheric-theme">
    /* Subtle atmospheric gradient reflecting MeteoMarto dynamic weather background */
    body {
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #f6f5fd 60%, #ecebf7 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Floating label notch simulation for Material/Atmospheric outline */
    .field-wrapper {
      position: relative;
    }
    
    .floating-label {
      position: absolute;
      top: -10px;
      left: 12px;
      background: #fbfbfe;
      padding: 0 6px;
      font-size: 0.78rem;
      line-height: 1rem;
      font-weight: 500;
      color: #65698e;
      z-index: 10;
    }

    /* Ambient glass elevation for floating action button */
    .fab-elevation {
      box-shadow: 0 8px 24px rgba(84, 85, 142, 0.15), 0 2px 6px rgba(0, 0, 0, 0.04);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 overflow-x-hidden font-sans">
<!-- BEGIN: PhoneContainer -->
<!-- Mimicking native 1080x2400 aspect screen container -->
<main class="w-full max-w-[420px] h-[915px] max-h-screen bg-transparent relative flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[44px] border border-white/60">
<!-- BEGIN: SystemStatusBar -->
<!-- Android / iOS Status Bar at Top -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-30 select-none text-slate-800" data-purpose="status-bar">
<!-- Time and notification indicator -->
<div class="flex items-center space-x-1.5">
<span class="text-[15px] font-semibold tracking-tight text-neutral-800">2:08</span>
<!-- Small shield / status icon from reference -->
<svg class="w-3.5 h-3.5 text-neutral-800 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Right System Icons: Cellular, Wifi, Battery -->
<div class="flex items-center space-x-2 text-neutral-900">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 24 24">
<rect height="6" rx="1" width="3" x="2" y="16"></rect>
<rect height="10" rx="1" width="3" x="8" y="12"></rect>
<rect height="14" rx="1" width="3" x="14" y="8"></rect>
<rect height="18" rx="1" width="3" x="20" y="4"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3.5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.007v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Battery with pill outline -->
<div class="w-6 h-3 rounded-md border-[1.5px] border-neutral-900 p-[1px] flex items-center relative">
<div class="h-full bg-neutral-900 rounded-[1.5px] w-full"></div>
<div class="w-0.5 h-1.5 bg-neutral-900 absolute -right-[3px] top-[2.5px] rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: SystemStatusBar -->
<!-- BEGIN: FloatingMenuButton -->
<!-- Floating Hamburger Button docked at the left side -->
<div class="absolute left-0 top-[48%] -translate-y-1/2 z-20">
<button aria-label="Open navigation menu" class="w-14 h-14 -ml-4 rounded-full bg-white/95 backdrop-blur-md fab-elevation flex items-center justify-end pr-3.5 transition-transform active:scale-95 border border-slate-100 text-slate-700 hover:text-slate-900" data-purpose="floating-navigation-toggle" type="button">
<!-- Hamburger Icon -->
<svg class="w-5 h-5 stroke-[2.4]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: FloatingMenuButton -->
<!-- BEGIN: AuthFormContent -->
<section class="flex-1 flex flex-col justify-center px-8 z-10 w-full" data-purpose="registration-card">
<!-- Screen Title -->
<div class="text-center mb-10">
<h1 class="text-[32px] sm:text-[34px] font-normal tracking-normal text-atmospheric-title">
          Create a new user
        </h1>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-4 w-full" data-purpose="signup-form" method="POST" onsubmit="event.preventDefault();">
<!-- Input: Email with Floating Label -->
<div class="field-wrapper" data-purpose="email-field-container">
<label class="floating-label" for="email-input">Email</label>
<input class="w-full h-14 px-4 pt-1 bg-transparent text-slate-800 placeholder:text-atmospheric-placeholder placeholder:font-normal text-[15px] rounded-lg border-2 border-atmospheric-border focus:outline-none focus:ring-0 focus:border-atmospheric-btnPrimary transition-colors" id="email-input" name="email" placeholder="Type your wonderful e-mail" type="email"/>
</div>
<!-- Input: Password with Eye Icon -->
<div class="relative" data-purpose="password-field-container">
<input class="w-full h-14 px-4 pr-12 bg-transparent text-slate-800 placeholder:text-atmospheric-placeholder text-[15px] rounded-lg border-2 border-atmospheric-border focus:outline-none focus:ring-0 focus:border-atmospheric-btnPrimary transition-colors" id="password-input" name="password" placeholder="Password" type="password"/>
<!-- Password Visibility Toggle Button -->
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-atmospheric-label hover:text-slate-700 transition-colors" data-purpose="password-toggle-button" id="toggle-password-btn" type="button">
<!-- Eye with slash icon matching screenshot -->
<svg class="w-5 h-5 stroke-[1.8]" fill="none" id="eye-icon-slash" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Open eye icon (hidden by default) -->
<svg class="w-5 h-5 stroke-[1.8] hidden" fill="none" id="eye-icon-open" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Action Button: Sign Up -->
<div class="pt-6">
<button class="w-full h-13 py-3.5 bg-atmospheric-btnDisabled text-atmospheric-btnDisabledText font-medium text-[17px] rounded-full transition-all duration-200 active:scale-[0.99] shadow-sm flex items-center justify-center" data-purpose="submit-signup" id="signup-button" type="submit">
            Sign up
          </button>
</div>
<!-- Footer Link: Already have an account? Login -->
<div class="text-center pt-8">
<a class="text-[15px] font-normal text-atmospheric-link hover:underline underline-offset-4 tracking-tight" data-purpose="link-to-login" href="#login">
            Already have an account? <span class="font-medium">Login</span>
</a>
</div>
</form>
</section>
<!-- END: AuthFormContent -->
<!-- BEGIN: GestureHomeBar -->
<!-- Android / iOS Native Navigation Bar -->
<footer class="w-full pb-3 flex justify-center items-end select-none" data-purpose="gesture-indicator-area">
<div class="w-36 h-1 bg-slate-500/70 rounded-full"></div>
</footer>
<!-- END: GestureHomeBar -->
</main>
<!-- END: PhoneContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-visibility-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('password-input');
      const eyeSlash = document.getElementById('eye-icon-slash');
      const eyeOpen = document.getElementById('eye-icon-open');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeSlash.classList.toggle('hidden', isPassword);
          eyeOpen.classList.toggle('hidden', !isPassword);
        });
      }
    });
  </script>
<script data-purpose="form-state-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const submitBtn = document.getElementById('signup-button');

      function validateInputs() {
        const hasEmail = emailInput.value.trim().length > 0;
        const hasPassword = passwordInput.value.length > 0;

        if (hasEmail && hasPassword) {
          // Activate button with MeteoMarto accent atmospheric styling
          submitBtn.classList.remove('bg-atmospheric-btnDisabled', 'text-atmospheric-btnDisabledText');
          submitBtn.classList.add('bg-atmospheric-btnPrimary', 'text-white', 'shadow-md', 'shadow-indigo-500/20');
        } else {
          // Revert to disabled neutral appearance
          submitBtn.classList.add('bg-atmospheric-btnDisabled', 'text-atmospheric-btnDisabledText');
          submitBtn.classList.remove('bg-atmospheric-btnPrimary', 'text-white', 'shadow-md', 'shadow-indigo-500/20');
        }
      }

      emailInput.addEventListener('input', validateInputs);
      passwordInput.addEventListener('input', validateInputs);
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
